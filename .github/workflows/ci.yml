name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint and check formatting with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run test suite
        run: pytest -v

  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Start Postgres, Redis, and SlotGuard API
        env:
          SEED_DEMO_ON_BOOT: "true"
          RATE_LIMIT_AUTH_REQUESTS: "200"
          RATE_LIMIT_BOOKING_REQUESTS: "500"
          RATE_LIMIT_WEBHOOK_REQUESTS: "200"
        run: docker compose up -d --build

      - name: Verify API health and Postgres/Redis backing stores
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8102/api/v1/health | grep -q '"status"'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8102/api/v1/health
          curl -fsS http://127.0.0.1:8102/api/v1/resources | grep -q '"items"'

      - name: Run 100-request double-booking & 30x HMAC replay benchmark on Postgres 16 + Redis 7
        run: |
          python3 -m pip install --quiet httpx
          python3 benchmarks/run_load_benchmark.py --base-url http://127.0.0.1:8102

      - name: Tear down Compose stack
        if: always()
        run: |
          docker compose logs api || true
          docker compose down -v --remove-orphans
