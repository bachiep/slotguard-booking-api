name: be02_slot_booking_api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotguard}
      POSTGRES_USER: ${POSTGRES_USER:-slotguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-docker-env}
    ports:
      - "5432:5432"
    volumes:
      - slotguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slotguard} -d ${POSTGRES_DB:-slotguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: docker
      API_HOST: 0.0.0.0
      API_PORT: 8102
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slotguard}:${POSTGRES_PASSWORD:-change-me-in-local-docker-env}@postgres:5432/${POSTGRES_DB:-slotguard}
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-before-production-use-at-least-32-chars}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-webhook-secret-change-me-in-production}
    ports:
      - "8102:8102"

volumes:
  slotguard_pgdata:
